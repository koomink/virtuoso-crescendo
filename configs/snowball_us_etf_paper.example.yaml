strategies:
  - id: snowball
    enabled: true
    mode: paper
    weight: 1.0
    entrypoint: "snowball.strategy:SnowballStrategy"
    config:
      selected_strategies: [dga, accelerated_dual_momentum, gtt_ue, baa_a]
      strategy_weights:
        dga: 0.25
        accelerated_dual_momentum: 0.25
        gtt_ue: 0.25
        baa_a: 0.25
      ticker_overrides: {}
      slot_overrides: {}

datahub:
  providers:
    - name: yahoo
      provider: yahoo
      data_types: [price, ohlcv, fundamental]
      symbols: [SPY, SCZ, QQQ, SCHD, BIL, TLT, PDBC, TIP, EFA, EEM, AGG, IEF, LQD]
      stale_after_seconds: 604800
    - name: fred
      provider: fred
      data_types: [macro]
      symbols: [UNRATE, T10Y3M]
      api_key_env: FRED_API_KEY
      stale_after_seconds: 7776000

execution:
  engine: paper
  order_generation_mode: target_rebalance

risk:
  max_single_asset_weight: 1.0
  min_cash_weight: 0.0

state:
  sqlite_path: var/snowball_us_etf_paper_state.db

audit:
  jsonl_path: var/snowball_us_etf_paper_audit.jsonl

approval:
  enabled: false
  provider: console
  require_approval: false
  default_decision: approved
  timeout_seconds: 300
